# Deployment config only — `wrangler deploy` is never run automatically by
# this project (section 25). Review before deploying manually.
name = "agentready-woo-agentic-commerce-readiness-toolkit-for-self-h"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Preview URLs require the script name to be <=54 chars; this name is 60.
# Not something we use anyway (no per-branch preview workflow here) — off.
preview_urls = false

# Custom domain — utilityhouse.xyz is already on this Cloudflare account,
# so wrangler provisions the DNS + TLS for this on deploy (no manual DNS
# record needed, unlike the Resend records which are external). Must stay
# a top-level key — placing it after a [[d1_databases]] block gets it
# silently parsed as a field of that table instead (TOML array-of-tables
# scoping), which is what happened here the first time.
routes = [
  { pattern = "app.utilityhouse.xyz", custom_domain = true }
]

# Marketing landing is the single source of truth — served as static assets
# ahead of the Worker; unmatched paths (app routes) fall through to the Worker.
[assets]
directory = "marketing/landing"

[vars]
REVENUE_SYSTEM_ENABLED = "true"
PUBLIC_BASE_URL = "https://app.utilityhouse.xyz"

# x402 per-call payment, on TESTNET.
#
# All four are public by nature — a receiving address is meant to be known, and
# the rest are constants — so they belong here rather than in secrets.
#
# eip155:84532 is Base SEPOLIA. Verified against the facilitator's own
# /supported, which lists exactly {x402Version:2, scheme:"upto",
# network:"eip155:84532"} — the combination X402PaymentProvider sends. Moving
# this to eip155:8453 is the switch to real money and must not be done casually.
X402_NETWORK = "eip155:84532"
X402_PAY_TO = "0xFBb1FFf3b0eb8D8d03d97Cf1309b6D401262347b"
# Circle's USDC on Base Sepolia, from Circle's own contract-address list.
X402_ASSET = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
X402_FACILITATOR_URL = "https://x402.org/facilitator"
#
# REAL_PAYMENTS_ENABLED is deliberately ABSENT, which the guard reads as false
# and which blocks settlement outright ("new financial exposure is disabled").
# Verification still runs, so the whole path can be exercised without anything
# being able to move. On testnet the funds are worthless anyway; the flag is
# what keeps that true if the network is ever changed above.

[triggers]
# Two triggers, dispatched in src/index.ts by which one fired. The frequent
# one recovers stuck financial operations; the daily one pings IndexNow. A
# phase that picked its own moment out of the frequent tick lost the whole
# day's work whenever an invocation started late.
crons = ["*/5 * * * *", "0 3 * * *"]

[[d1_databases]]
binding = "FINANCIAL_DB"
database_name = "money-ai-prod-d1"
database_id = "00000000-0000-0000-0000-000000000000"  # placeholder: this mirror does not deploy

[ai]
binding = "AI"

[[workflows]]
name = "agentready-release-gate"
binding = "RELEASE_GATE_WORKFLOW"
class_name = "ReleaseGateAcceptanceWorkflow"

# Secrets (set with `wrangler secret put <name>`, never in this file):
#   APP_ENCRYPTION_SECRET  — encrypts stored Woo consumer secrets at rest
#   CART_SIGNING_SECRET    — signs the human-checkout cart handoff links
#   PADDLE_WEBHOOK_SECRET  — verifies inbound Paddle webhook signatures
#   PADDLE_PRICE_REPORT / _PRO / _AGENCY — Paddle price ids; billing page
#     only shows a plan's checkout link once its price id is set.
#     REPORT and PRO are one-time prices (no billing_cycle) — a one-off
#     unlock, not a subscription. AGENCY is a real yearly subscription.
#   OPS_TOKEN — bearer token for GET /ops/funnel (scan -> wall -> checkout
#     funnel counts); the route 503s until this is set — see src/app.ts
#   ADMIN_PASSWORD — HTTP Basic Auth password for /admin (operator user list
#     + detail + password-reset-link generation); 503s until set (min 12
#     chars) — see requireAdmin() in src/app.ts
#   RESEND_API_KEY / EMAIL_FROM — sends the forgot-password email via Resend's
#     REST API; without these, password reset still works end-to-end but the
#     link must be handed to the merchant manually from /admin — see
#     src/core/email.ts
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — enables "Continue with Google"
#     on /signup and /login; without these, only email/password auth shows —
#     see requireAdmin()-style fail-closed googleOn check in src/app.ts
#   Workers AI is bound as AI above (not a plaintext API key). It may add
#     limited AI-assisted copy drafts to the Commerce Readiness Packet after
#     strict input filtering; deterministic packet delivery never depends on it.
#   RELEASE_GATE_OWNERSHIP_SECRET — derives per-store ownership challenge HMACs.
#   RELEASE_EVIDENCE_CURRENT_KEY — root used to derive per-store plugin HMACs
#   RELEASE_EVIDENCE_PREVIOUS_KEY / _EXPIRES_AT — optional rotation grace;
#     missing, invalid, or expired timestamp fails closed.
