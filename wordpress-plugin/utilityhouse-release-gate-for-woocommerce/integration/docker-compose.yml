# Disposable real WordPress + WooCommerce integration environment.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: agentready-harness
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: agentready-harness
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    build:
      context: ../../..
      dockerfile: wordpress-plugin/utilityhouse-release-gate-for-woocommerce/integration/Dockerfile
      args:
        WP_CLI_IMAGE: "${AGENTREADY_WP_CLI_IMAGE:-wordpress:cli-php8.3}"
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: agentready-harness
      AGENTREADY_HPOS: "${AGENTREADY_HPOS:-on}"
      AGENTREADY_WP_VERSION: "${AGENTREADY_WP_VERSION:-latest}"
      AGENTREADY_WOO_VERSION: "${AGENTREADY_WOO_VERSION:-latest}"
      AGENTREADY_PLUGIN_CHECK: "${AGENTREADY_PLUGIN_CHECK:-0}"
    entrypoint: ["/bin/bash", "/run.sh"]

  web:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - wp:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: agentready-harness

volumes:
  wp:
